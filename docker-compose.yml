services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: izl
      POSTGRES_PASSWORD: izl
      POSTGRES_DB: iziloyer_dev
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U izl -d iziloyer_dev"]
      interval: 3s
      retries: 10
  flyway:
    image: flyway/flyway:10
    command: -url=jdbc:postgresql://db:5432/iziloyer_dev -user=izl -password=izl -connectRetries=10 migrate
    volumes: ["./db/migrations:/flyway/sql"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata: